[tool.ruff]
line-length = 99
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"settings/env/*.py" = ["F403", "F405"]
"settings/base.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "settings"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "rest-framework",
    "django",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"rest-framework" = ["rest_framework", "rest_framework_simplejwt"]
"django" = ["django"]
